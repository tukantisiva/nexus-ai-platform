name: Daily AI Intelligence Ingestion Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Executes daily at 06:00 UTC (Keeps Supabase free tier active)
  workflow_dispatch:     # Enables manual runs from GitHub UI

jobs:
  ingest:
    name: Run Free Ingestion & Vector Embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Ingestion Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_ingest.py
